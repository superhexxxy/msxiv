<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <!-- background -->
  <rect width="1280" height="640" fill="#0a0a0f"/>

  <!-- pixel corner accents -->
  <rect x="24" y="24" width="12" height="12" fill="#ff6b9d"/>
  <rect x="1244" y="24" width="12" height="12" fill="#b388ff"/>
  <rect x="24" y="604" width="12" height="12" fill="#7dd3fc"/>
  <rect x="1244" y="604" width="12" height="12" fill="#ff6b9d"/>

  <!-- scattered pixels -->
  <rect x="200" y="150" width="6" height="6" fill="#b388ff" opacity="0.6"/>
  <rect x="1080" y="130" width="6" height="6" fill="#7dd3fc" opacity="0.6"/>
  <rect x="170" y="440" width="6" height="6" fill="#7dd3fc" opacity="0.6"/>
  <rect x="1110" y="440" width="6" height="6" fill="#ff6b9d" opacity="0.6"/>

  <!-- icon: pixel image frame with cat ears, 2x -->
  <g transform="translate(88,124) scale(2)">
    <!-- left ear -->
    <rect x="44" y="52" width="8" height="12" fill="#ff6b9d"/>
    <rect x="52" y="44" width="8" height="20" fill="#ff6b9d"/>
    <rect x="60" y="52" width="8" height="12" fill="#ff6b9d"/>
    <rect x="52" y="52" width="8" height="8" fill="#b388ff"/>
    <!-- right ear -->
    <rect x="100" y="52" width="8" height="12" fill="#ff6b9d"/>
    <rect x="108" y="44" width="8" height="20" fill="#ff6b9d"/>
    <rect x="116" y="52" width="8" height="12" fill="#ff6b9d"/>
    <rect x="108" y="52" width="8" height="8" fill="#b388ff"/>
    <!-- frame -->
    <rect x="28" y="64" width="112" height="88" fill="#ff6b9d"/>
    <rect x="36" y="72" width="96" height="72" fill="#0a0a0f"/>
    <!-- pixel sun -->
    <rect x="104" y="84" width="12" height="12" fill="#f0f0f5"/>
    <!-- pixel mountains -->
    <rect x="88" y="132" width="36" height="12" fill="#7dd3fc"/>
    <rect x="96" y="120" width="20" height="12" fill="#7dd3fc"/>
    <rect x="44" y="128" width="48" height="16" fill="#b388ff"/>
    <rect x="52" y="116" width="32" height="12" fill="#b388ff"/>
    <rect x="60" y="104" width="16" height="12" fill="#b388ff"/>
  </g>

  <!-- wordmark -->
  <text x="428" y="330" font-family="'JetBrains Mono','Courier New',monospace" font-size="120" font-weight="700"><tspan fill="#7a7a8a">&gt; </tspan><tspan fill="#f0f0f5">ms</tspan><tspan fill="#ff6b9d">xiv</tspan></text>
  <!-- cursor block -->
  <rect x="940" y="240" width="16" height="95" fill="#ff6b9d"/>

  <!-- tagline -->
  <text x="430" y="405" font-family="'JetBrains Mono','Courier New',monospace" font-size="26" letter-spacing="3" fill="#7a7a8a">keyboard-driven image viewer for macOS</text>

  <!-- pixel divider stripe -->
  <defs>
    <pattern id="px" width="36" height="8" patternUnits="userSpaceOnUse">
      <rect x="0" width="8" height="8" fill="#ff6b9d"/>
      <rect x="12" width="8" height="8" fill="#b388ff"/>
      <rect x="24" width="8" height="8" fill="#7dd3fc"/>
    </pattern>
  </defs>
  <rect x="140" y="496" width="1000" height="8" fill="url(#px)" opacity="0.5"/>

  <!-- tiny ascii cat, bottom right -->
  <text x="1060" y="560" font-family="'JetBrains Mono','Courier New',monospace" font-size="18" fill="#b388ff" opacity="0.7" xml:space="preserve"><tspan x="1060" dy="0"> /\_/\</tspan><tspan x="1060" dy="22">( o.o )</tspan><tspan x="1060" dy="22"> &gt; ^ &lt;</tspan></text>
</svg>